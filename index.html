<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Новая жизнь — симулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="brand">Новая жизнь</div>
      <div class="subtitle" id="cityLine">Начни историю с нуля</div>
    </div>
    <button class="icon-btn" id="resetBtn" title="Новая игра">↻</button>
  </div>

  <main id="screen"></main>

  <nav class="bottom-nav">
    <button data-screen="home">⌂<span>Домой</span></button>
    <button data-screen="work">▣<span>Работа</span></button>
    <button data-screen="city">⌖<span>Город</span></button>
    <button data-screen="relations">♡<span>Отношения</span></button>
    <button data-screen="business">▥<span>Бизнес</span></button>
  </nav>
</div>
<script src="game.js"></script>
</body>
</html>
